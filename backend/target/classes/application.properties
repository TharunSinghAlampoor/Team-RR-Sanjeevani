# ============================================================
# Server & Response Compression Settings
# ============================================================
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=512

# Tomcat Thread & Connection Tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

# HikariCP Database Connection Pool & JDBC Performance Optimization
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# ============================================================
# MySQL Datasource
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/e-commerce?useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Tharun@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate Batching & High Throughput Tuning
# ============================================================
# Hibernate Dialect is auto-detected dynamically from JDBC connection metadata (MySQLDialect for MySQL, H2Dialect for H2)
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=${JWT_SECRET:c3VwZXJTZWNyZXRLZXlGb3JFQ29tbWVyY2VBdXRoU2VydmljZTIwMjZQcm9kdWN0aW9uUmVhZHk=}
jwt.expiration-ms=3600000

# ============================================================
# Session Configuration
# ============================================================
session.expiry-minutes=60

# ============================================================
# OTP Configuration
# ============================================================
otp.expiry-minutes=5
otp.length=6

# ============================================================
# Rate Limiting
# ============================================================
rate-limit.login.requests-per-minute=5
rate-limit.otp.requests-per-minute=3

# ============================================================
# Logging
# ============================================================
logging.level.com.ecommerce.auth=INFO
logging.level.com.ecommerce.auth.filter=WARN
logging.level.org.springframework.security=WARN

