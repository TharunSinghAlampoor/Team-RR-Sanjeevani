services:
  # ── 1. Backend Spring Boot Web Service ──
  - type: web
    name: sanjeevani-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        value: c3VwZXJTZWNyZXRLZXlGb3JFQ29tbWVyY2VBdXRoU2VydmljZTIwMjZQcm9kdWN0aW9uUmVhZHk=
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://127.0.0.1:3306/E-Commerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: Tharun@123

  # ── 2. Frontend React Vite Static Site ──
  - type: web
    name: sanjeevani-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
